name: Build 14CFW

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    container: devkitpro/devkita64:latest
    steps:
      - uses: actions/checkout@v4

      - name: Install libraries
        run: |
          dkp-pacman -Sy --noconfirm
          dkp-pacman -S --noconfirm --needed switch-sdl2 switch-sdl2_ttf switch-curl switch-mbedtls switch-zlib switch-freetype switch-pkg-config

      - name: Build
        run: |
          export DEVKITPRO=/opt/devkitpro
          make clean || true
          make -j2

      - name: Package (switch/14CFW/14CFW.nro)
        run: |
          mkdir -p dist/switch/14CFW
          cp 14CFW.nro dist/switch/14CFW/
          cd dist && zip -r ../14CFW.zip switch

      - uses: actions/upload-artifact@v4
        with:
          name: 14CFW
          path: |
            14CFW.nro
            14CFW.zip
